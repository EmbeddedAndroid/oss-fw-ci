# The only way a case may end other than pass on a board (docs/DESIGN.md):
# board, case (<suite>/<name>), the result it is allowed (fail or skip),
# the reason, an evidence link and the reviewer. A non-pass without an
# entry is a failure. This list is the port-complete bar: a board is done
# when its runs pass or are justified case for case.
# Changes are PRs reviewed by Tyler.
