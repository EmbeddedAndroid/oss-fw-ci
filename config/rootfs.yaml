# The root filesystem every board boots (docs/DESIGN.md): qcom-buildroot's
# test image (TEST=y) at one commit, unchanged. The rootfs job checks that
# the checked-out tree is exactly `commit` with nothing applied
# (ossci.rootfs check) and refuses anything else; a change goes to
# qcom-buildroot first, then this pin moves. Built once per
# (commit, test-definitions commit, makefile) and cached.
repo: https://github.com/qualcomm-linux/qcom-buildroot.git
# main, the newest public commit (2026-11-07).
commit: 6bd87d78b36e48446635dd3567e0931903cb7525
upstream: true
# Where a pin that is not upstream can be fetched ({repo, branch, note};
# repo null: nowhere public, the rootfs job then skips every board with
# the note). Not needed while the pin is on main.
source: null
# Pin watch: main has no test packages for tee-shm-reclaim and
# suspend-idle and no QEMU kvm-unit-tests (QCOM_TESTS names them; the
# makefile ignores names it does not know). The pin moves to the commit
# of qcom-buildroot's test-config PR once it lands on main
# (config/justifications.yaml lists what that gap costs).
watch: qcom-buildroot test-config PR (qcom-test-suite 79369f4, not opened yet)
# repo manifest of the tree; the `build` project is replaced by the
# pinned checkout.
manifest: manifests/kodiak.xml
# Revisions for projects the manifest leaves on a moving branch, where
# that branch no longer builds with the manifest's own pins. Each entry
# is a qcom-buildroot bug to fix upstream (pin the project there), then
# drop here. The dashboard shows them with the rootfs.
manifest_overrides:
  OP-TEE/optee_test.git:
    revision: 953c16912391d000e413468cb8a631d5d7ff627f
    reason: >-
      manifests/common.xml leaves optee_test on master while kodiak.xml
      pins optee_os 9bcaec96 (2026-09-09); optee_test 00d4f0e (2026-11-02,
      regression 1047 ASLR test) needs PTA_INVOKE_TESTS_CMD_ASLR, which
      that optee_os lacks, so xtest does not build. 953c169 is the last
      optee_test commit before the ASLR series.
# Per architecture: the board makefile whose `buildroot` target builds the
# image, and the make arguments. QCOM_TESTS names every test of the suite
# (the makefile narrows it by default); the inference model is in the
# image (MODEL_DIR); the issue text carries the rootfs fingerprint
# (boot-fingerprint ROOTFS_FINGERPRINT).
arch:
  arm64:
    makefile: kodiak.mk
    make_args:
      - TEST=y
      - QCOM_TESTS=boot-fingerprint boot-handoff cpu-features cpu-hotplug cpufreq-policy kernel-health maxcpus memtest remoteproc-smoke remoteproc-restart fastrpc optee-xtest tee-shm-reclaim alsa-dsp-restart memtester kvm-unit-tests kvm-guest gpu-render video-codec inference suspend-idle
      - QCOM_TEST_INFERENCE_MODEL=y
    issue: "OP-TEE embedded distrib for kodiak {fingerprint}"
    output: out-br/images/rootfs.cpio.gz
