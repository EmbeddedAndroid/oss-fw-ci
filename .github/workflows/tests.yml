# Unit tests for every push to main and every pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: [self-hosted, cil, arm64, 2c-4g-20g]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --network host -q --target control -t ossci-control:1 docker
      - run: scripts/in-container.sh python3 -m pytest -q -p no:cacheprovider tests
